name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Classify before setup so documentation-only changes stay genuinely cheap.
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base="$(git rev-parse HEAD^)"
          fi
          args=(--mode committed --docs-only-check --github-output "$GITHUB_OUTPUT")
          if [[ -n "$base" ]]; then args+=(--base-sha "$base"); fi
          python3 scripts/changed_scope.py "${args[@]}"

      - name: Setup Rust toolchain
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.root_needed == 'true'
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master, resolved 2026-07-12
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - name: Setup Crab v2 Rust toolchain
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.v2_needed == 'true'
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Setup Rust cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
            v2 -> target

      - name: Setup Node for first-party bridge tests
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.v2_needed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Format, Clippy, and tests
        if: steps.scope.outputs.docs_only != 'true'
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          DIFF_MODE: committed
        run: make check

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.scope.outputs.docs_only }}" == "true" ]]; then
            echo "### quality: skipped (docs-only)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### quality: format, Clippy, and tests executed" >> "$GITHUB_STEP_SUMMARY"
          fi
