schema = 1
id = "channel-gateway"
kind = "box"
owned = ["boxology.toml", "implementation/**"]

[[imports]]
package = "agent-host"
contract = "agent-host"

[[imports]]
package = "native-channel"
contract = "native-channel"

[quality]
commands = [
    "cargo check -p channel-gateway-contract --all-features",
    "cargo test -p channel-gateway-implementation",
]

[[crates]]
cargo_package = "channel-gateway-implementation"
path = "implementation"
role = "box-implementation"

[[crates]]
cargo_package = "channel-gateway-contract"
path = "generated/contract"
role = "box-contract"

[[derived]]
id = "contract"
generator = "boxology-contract"
inputs = ["boxology.toml", "implementation/src/**"]
outputs = ["generated/contract/**", "generated/adapter/**", "generated/schema.json"]
