[package]
name = "channel-gateway-implementation"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
boxology = { workspace = true }
boxology-contract = { workspace = true }
boxology-runtime = { workspace = true }
boxology_generated_contract = { package = "channel-gateway-contract", version = "=0.0.0", path = "../generated/contract" }
boxology_import_agent_host = { package = "agent-host-contract", version = "=0.0.0", path = "../../agent-host/generated/contract" }
boxology_import_native_channel = { package = "native-channel-contract", version = "=0.0.0", path = "../../native-channel/generated/contract" }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
