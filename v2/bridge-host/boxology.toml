schema = 1
id = "bridge-host"
kind = "box"
owned = [
    "boxology.toml",
    "README.md",
    "bridge-control-boundary.mmd",
    "bridge-control-boundary.png",
    "bridge-registration-boundary.mmd",
    "bridge-registration-boundary.png",
    "bridge-result-boundary.mmd",
    "bridge-result-boundary.png",
    "bridge-message-boundary.mmd",
    "bridge-message-boundary.png",
    "implementation/**",
]

[[imports]]
package = "trigger-inbox"
contract = "trigger-inbox"

[quality]
commands = [
    "cargo check -p bridge-host-contract --all-features",
    "cargo test -p bridge-host-implementation",
]

[[crates]]
cargo_package = "bridge-host-implementation"
path = "implementation"
role = "box-implementation"

[[crates]]
cargo_package = "bridge-host-contract"
path = "generated/contract"
role = "box-contract"

[[derived]]
id = "contract"
generator = "boxology-contract"
inputs = ["boxology.toml", "implementation/src/**"]
outputs = ["generated/contract/**", "generated/adapter/**", "generated/schema.json"]
