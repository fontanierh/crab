schema = 1
id = "runtime-control"
kind = "box"
owned = ["boxology.toml", "implementation/**"]

[quality]
commands = [
    "cargo check -p runtime-control-contract --all-features",
    "cargo test -p runtime-control-implementation",
]

[[crates]]
cargo_package = "runtime-control-implementation"
path = "implementation"
role = "box-implementation"

[[crates]]
cargo_package = "runtime-control-contract"
path = "generated/contract"
role = "box-contract"

[[derived]]
id = "contract"
generator = "boxology-contract"
inputs = ["boxology.toml", "implementation/src/**"]
outputs = ["generated/contract/**", "generated/adapter/**", "generated/schema.json"]
