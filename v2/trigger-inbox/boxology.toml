schema = 1
id = "trigger-inbox"
kind = "box"
owned = ["boxology.toml", "implementation/**"]

[quality]
commands = [
    "cargo check -p trigger-inbox-contract --all-features",
    "cargo test -p trigger-inbox-implementation",
]

[[crates]]
cargo_package = "trigger-inbox-implementation"
path = "implementation"
role = "box-implementation"

[[crates]]
cargo_package = "trigger-inbox-contract"
path = "generated/contract"
role = "box-contract"

[[derived]]
id = "contract"
generator = "boxology-contract"
inputs = ["boxology.toml", "implementation/src/**"]
outputs = ["generated/contract/**", "generated/adapter/**", "generated/schema.json"]
