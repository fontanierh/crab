[workspace]
resolver = "3"
members = [
    "agent-host/generated/contract",
    "agent-host/implementation",
    "bridge-host/generated/contract",
    "bridge-host/implementation",
    "native-channel/generated/contract",
    "native-channel/implementation",
    "runtime/composition",
    "sub-agent-host/generated/contract",
    "sub-agent-host/implementation",
    "trigger-inbox/generated/contract",
    "trigger-inbox/implementation",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# This hand-managed non-HTTP workspace uses the published 0.1.1 closure. Initializer-generated
# HTTP examples still require coherent Git pins because `boxology-http` is not published yet.
boxology = "=0.1.1"
boxology-contract = "=0.1.1"
boxology-manifest = "=0.1.1"
boxology-runtime = "=0.1.1"
