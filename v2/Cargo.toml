[workspace]
resolver = "3"
members = [
    "agent-host/generated/contract",
    "agent-host/implementation",
    "bridge-host/generated/contract",
    "bridge-host/implementation",
    "native-channel/generated/contract",
    "native-channel/implementation",
    "runtime/composition",
    "sub-agent-host/generated/contract",
    "sub-agent-host/implementation",
    "trigger-inbox/generated/contract",
    "trigger-inbox/implementation",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Boxology 0.1.0 is not fully published. This is the initializer-supported
# portable dependency form from the post-V0 release baseline.
boxology = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "e700b8358e3c5b42677406240fda8c3025d3d04f" }
boxology-contract = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "e700b8358e3c5b42677406240fda8c3025d3d04f" }
boxology-manifest = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "e700b8358e3c5b42677406240fda8c3025d3d04f" }
boxology-runtime = { version = "=0.0.0", git = "https://github.com/fontanierh/boxology", rev = "e700b8358e3c5b42677406240fda8c3025d3d04f" }
