[workspace]
resolver = "3"
members = [
    "agent-host/generated/contract",
    "agent-host/implementation",
    "bridge-host/generated/contract",
    "bridge-host/implementation",
    "channel-gateway/generated/contract",
    "channel-gateway/implementation",
    "native-channel/generated/contract",
    "native-channel/implementation",
    "runtime/composition",
    "runtime-control/generated/contract",
    "runtime-control/implementation",
    "sub-agent-host/generated/contract",
    "sub-agent-host/implementation",
    "turn-router/generated/contract",
    "turn-router/implementation",
    "trigger-inbox/generated/contract",
    "trigger-inbox/implementation",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Keep the complete Boxology runtime closure on one exact crates.io release.
boxology = "=0.2.2"
boxology-contract = "=0.2.2"
boxology-manifest = "=0.2.2"
boxology-runtime = "=0.2.2"
agent-client-protocol = { version = "=2.0.0", features = ["unstable_protocol_v2", "unstable_session_fork"] }
agent-client-protocol-rmcp = "=3.0.0"
async-trait = "0.1.89"
base64 = "0.22.1"
nix = { version = "0.30.1", features = ["process", "signal"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["raw_value"] }
schemars = "=1.2.2"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.25.0", features = ["v4"] }

[patch.crates-io]
# Temporary reviewed backport of ACP SDK issues #340 and #342 onto the published v2.0.0 source.
# Keep the registry constraints above so this patch also covers RMCP's transitive ACP dependency.
agent-client-protocol = { git = "https://github.com/fontanierh/rust-sdk", rev = "3722fbf26716ac77269d05738d358b7c97601529" }
